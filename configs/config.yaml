# Central configuration. All paths are relative to the project root.
# Values marked "TODO" are decided during the corresponding analysis step.

seed: 42

data:
  raw_file: data/raw/data-zuerich_2026-10-29.csv
  # SHA-256 of the analysed snapshot (downloaded 2026-10-29 10:48 CET)
  sha256: 45ee2bc7d5c793d3ee32f2191d86ba8c5aa41551105811b3a432714de6efc5cc
  # Live source: always returns the current state, so the checksum will differ
  source_url: https://www.stadt-zuerich.ch/geodaten/download/Zueri_wie_neu
  # Fixed snapshot as GitHub release asset
  snapshot_url: https://github.com/elisab-code/data-analysis-zueri/releases/download/data-2026-10-29/data-zuerich_2026-10-29.csv
  text_column: detail
  # Output of the preprocessing pipeline (generated, not in the repo)
  processed_file: data/processed/reports.parquet
  # Small random sample of the processed data as CSV, for reading in an editor
  preview_file: data/processed/preview.csv
  preview_size: 200

preprocessing:
  # Placeholder for e-mail addresses in report texts (personal data)
  email_placeholder: ""     # e-mail addresses are removed
  # Greeting and closing phrases removed in the light cleaning, matched
  # case-insensitively as whole words. Candidates from the data review
  # (number of reports containing the phrase). TODO: review the list.
  phrases:
    - guten tag              # 2229
    - grüezi                 # 413
    - hallo                  # 287
    - sehr geehrte damen und herren
    - besten dank für ihre meldung   # quoted replies of the city
    - vielen dank im voraus
    - besten dank im voraus
    - vielen dank            # 1885
    - besten dank            # 1336
    - herzlichen dank
    - danke                  # 3425
    - freundliche grüsse     # 1430
    - freundlichen grüssen
    - beste grüsse
    - liebe grüsse           # 89
    - mfg                    # 256
    - lg                     # 68

  # Strong cleaning (TF-IDF)
  spacy_model: de_core_news_sm
  spacy_batch_size: 1000
  # spaCy stopwords that are kept because they carry meaning in reports.
  # Compared with the lowercase lemma ("keine" -> "kein", "Jahren" -> "jahr").
  # Counts: reports containing the phrase (data review).
  keep_stopwords:
    # negation: "leuchtet nicht mehr" (2567), "niemand", "nichts", "ohne"
    - nicht
    - kein
    - nie
    - niemand
    - nichts
    - ohne
    # duration and repetition: "immer wieder" (1116), "immer noch" (978),
    # "schon wieder" (384), "seit Jahren" (250), "bereits gemeldet"
    - seit
    - immer
    - wieder
    - noch
    - mehr
    - schon
    - bereits
    - oft
    - lang
    - lange
    # time units: spaCy treats "Jahr" and "Tag" as stopwords ("Woche" is not)
    - jahr
    - tag

  # Corrections for lemmatizer errors (applied after lowercasing and ß -> ss).
  # Counts in the processed data before the correction (2026-11-23).
  lemma_fixes:
    strass: strasse            # 1338 vs. 3200 "strasse"
    strassen: strasse          # 29
    velos: velo                # 1448 vs. 2745 "velo"
    schrottvelos: schrottvelo  # 75 vs. 424
    mülltonn: mülltonne        # 52 vs. 37
    # Counts from 2026-11-27
    lamp: lampe                # 160, from "Lampe"
    strassenlatern: strassenlaterne  # 499 vs. 79
    graffitis: graffiti        # 357, plural
    grafitti: graffiti         # 170, typo
    grafiti: graffiti          # 134, typo
    kaputtes: kaputt           # 200, adjective forms
    kaputter: kaputt           # 72
    defektes: defekt           # 121
    defekter: defekt           # 109
    fahrräder: fahrrad         # 120, plural
    abfallsäcke: abfallsack    # 187, plural
    abfallhaufe: abfallhaufen  # 24
    abfallberge: abfallberg    # 21, plural
    fahrräd: fahrrad           # 232, from "Fahrräder"
    motorräder: motorrad       # 162 vs. 224
    äste: ast                  # 334 vs. 439
    tigermück: tigermücke      # 62 vs. 449
    mück: mücke                # 62 vs. 47
    abgedrehen: abdrehen       # 270, from "abgedreht"
    entsorgt: entsorgen        # 658, from "entsorgter Abfall" (adjective)
    wilder: wild               # 68, from "wilder Müll"

  # Synonyms mapped to one word (applied after lemma_fixes, whole words only).
  # Unlike lemma_fixes this is an interpretation, so it is kept as a separate list.
  # Only words that name the same thing. Compounds keep their second part
  # ("müllsack" -> "abfallsack", not "abfall"), because waste bins, bags and
  # piles are different concerns. Words that only contain a listed word stay
  # unchanged (e.g. the street name "müllerstrasse").
  synonyms:
    # waste (Swiss: "Kehricht", "Littering" = waste left in public space)
    müll: abfall               # 1633 vs. 6041 "abfall"
    unrat: abfall              # 159
    littering: abfall          # 520
    kehricht: abfall           # 20
    # waste bags
    müllsack: abfallsack       # 54
    kehrichtsack: abfallsack
    # waste bins
    mülleimer: abfalleimer     # 152 vs. 518
    abfallkübel: abfalleimer   # 320
    abfallbehälter: abfalleimer  # 91
    abfallkorb: abfalleimer    # 16
    # large waste containers
    mülltonne: abfallcontainer   # 79 vs. 124
    müllcontainer: abfallcontainer  # 55
    # waste piles in the wrong place
    müllhalde: abfallhaufen    # 103 vs. 103
    mülldeponie: abfallhaufen  # 120
    abfalldeponie: abfallhaufen  # 105
    abfallberg: abfallhaufen   # 60 (+21 plural)
    müllberg: abfallhaufen     # 18
    müllentsorgung: abfallentsorgung  # 100 vs. 307
    # bulky waste: kept apart from "abfall", it has its own collection
    # and mostly means furniture or mattresses
    sperrgut: sperrmüll        # 395 vs. 409
    # bicycles
    fahrrad: velo              # 612 (+352 plural forms) vs. 3635
    veloschrott: schrottvelo   # 158 vs. 499
    # Swiss diminutives
    einkaufswägeli: einkaufswagen  # 242 vs. 249
    möbeli: möbel              # 73 vs. 831
    # street lighting
    strassenlampe: lampe       # 665 vs. 737
    strassenlaterne: lampe     # 79 (+499 lemma fix)
    laterne: lampe             # 166
    # graffiti
    schmiererei: graffiti      # 245
    sprayerei: graffiti        # 73

tfidf:
  # Single words and word pairs ("tempo 30", "lampe defekt")
  ngram_range: [1, 2]
  # Minimum number of reports a term must occur in. Without a limit there are
  # 491,060 terms, most of them typos or word pairs that occur only once.
  # With 10 there are about 11,000 (2026-11-24).
  min_df: 10
  # Maximum share of reports. Safety net only: the most frequent term ("nicht")
  # occurs in 15.9 % of the reports, so 0.5 removes nothing in this snapshot.
  max_df: 0.5
  # Words that are not used as TF-IDF terms. They occur with every kind of
  # object, so NMF would build topics from them that say nothing about the
  # object ("seit woche"). A term is removed if it contains one of these words:
  # "seit" and "stehen seit" are removed, "stehen" is kept.
  # The words stay in text_strong, where the state markers find them.
  # Shares: reports containing the word (2026-11-27).
  exclude_words:
    # how a problem is described: negation, duration, repetition.
    # Includes all keep_stopwords of the preprocessing.
    state:
      - nicht        # 15.9 %
      - kein
      - nie
      - niemand
      - nichts
      - ohne
      - seit         # 9.6 %
      - immer
      - wieder
      - noch
      - mehr
      - schon
      - bereits
      - oft
      - lang
      - lange
      - jahr
      - tag          # a graffiti "Tag" only in about 36 reports, plural "tags" stays
      - woche        # 4.5 %
      - monat
      - letzter
      - regelmässig
      - bleiben
    # about the report itself or filler words, not about the problem
    meta:
      - bitte        # 6.6 %
      - sehen
      - foto
      - bild
      - melden
      - meldung
      - zürich
      - stadt
      - stelle
      - ort
      - situation
      - mal
      - mehrere
      - ca.
      - ca
      - einfach
      - direkt
      - fast
      - scheinen
      - finden
      - befinden
      - neu
      - alt
  # Remove terms that consist only of numbers ("2", "10 12"). Word pairs with
  # a number and a word are kept ("tempo 30", "tram 4").
  exclude_numbers: true

embeddings:
  # Multilingual model (German included), 384 dimensions, input limit 128 tokens
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  # Fixed model version (commit on Hugging Face) for reproducibility
  revision: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
  batch_size: 64
  cache_file: results/cache/embeddings.npy

results:
  # Topic assignment per report (contains report ids, not in the repo)
  assignments_file: results/cache/topics.parquet
  # Topic words and shares (no report texts, in the repo)
  tables_dir: results/tables
  # Figures (in the repo)
  figures_dir: results/figures

topics:
  # k scan (number of topics): k_min, k_min + k_step, ..., k_max
  k_min: 5
  k_max: 40
  k_step: 5
  # Number of topics, chosen with the k scan (results/tables/k_scan.csv):
  # highest NMF coherence (0.58), both methods stable (0.95 and 0.97).
  # From k = 15 the KMeans stability drops to about 0.7.
  k: 10
  n_top_words: 10
  # Example reports per topic in the notebook
  n_examples: 5
  # Stability check: both methods are fitted on random samples of the reports
  # (one sample per seed) and the topic assignments of all reports are compared.
  stability_seeds: [1, 2, 3]
  stability_sample: 0.8
  nmf:
    # nndsvda: deterministic start from a matrix decomposition (SVD), recommended
    # by scikit-learn for sparse data. The same data always gives the same topics,
    # so the stability check varies the data (samples), not the start.
    init: nndsvda
    max_iter: 500
    # A report gets a topic only if the topic describes at least this part of
    # its TF-IDF vector (see topic_contributions). Below it: no clear topic.
    # At k = 10, three quarters of the reports in the catch-all topic are below
    # 0.06 and three quarters of the reports in the other topics are above 0.1.
    min_weight: 0.1
  kmeans:
    # Number of runs with different start centers, the best one is kept
    n_init: 10

# State markers: how a report describes its problem, independent of the object.
# Regular expressions on text_strong (lowercase lemmas). A report has a state if
# one of its patterns matches. "wieder" alone is not counted, it is too vague
# ("wieder voll", "wieder montiert"). Shares: reports matching (2026-11-27).
# All patterns together: duration 9.5 %, repetition 3.9 %, danger 6.0 %.
states:
  duration:
    - '\bseit\b(?: \S+){0,3}? (?:stunde|tag|woche|monat|jahr)\b'   # "seit 3 woche", 6.8 %
    - '\bseit (?:19|20)\d\d\b'          # "seit 2023", 0.02 %
    - '\bseit lange?\b'                 # "seit langem", 0.7 %
    - '\bimmer noch\b'                  # 1.2 %
    - '\bnoch immer\b'                  # 0.3 %
    - '\bschon lange?\b'                # 0.6 %
  repetition:
    - '\bimmer wieder\b'                # 1.4 %
    - '\bschon wieder\b'                # 0.5 %
    - '\bmal wieder\b'                  # 0.2 %
    - '\bwieder mal\b'                  # 0.2 %
    - '\berneut\b'                      # 0.4 %
    - '\bregelmässig\b'                 # 1.2 %
    - '\bwiederholt\b'                  # 0.2 %
  danger:
    - '\bgefährlich\w*'                 # 3.3 %
    - '\b\w*gefahr\b'                   # "gefahr", "unfallgefahr", not "gefahrlos", 1.7 %
    - '\bgefahren(?:stelle?|quelle|potential)\b'   # 0.05 %
    - '\bgefährd\w*'                    # "gefährden", "gefährdung", 0.3 %
    - '\b\w*unfall\w*'                  # "unfall", "velounfall", "verunfallen", 0.8 %
    - '\b\w*sicherheit(?:srisiko|srelevant)?\b'    # not "sicherheitslinie", 0.6 %
    - '\bunsicher\w*'                   # 0.07 %

evaluation:
  coherence: c_v
